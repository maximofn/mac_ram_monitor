[package]
name = "mac-ram-monitord"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "macOS RAM monitor daemon — HTTP/SSE backend serving memory/swap/process metrics."

[[bin]]
name = "mac-ram-monitord"
path = "src/main.rs"

[dependencies]
mac-ram-monitor-core = { path = "../mac-ram-monitor-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
hostname = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Cross-platform: total/used/available memory, swap totals, per-process RSS/VSZ.
# `system` covers everything we need; default features pull in network/disk that
# would just waste cycles on each refresh.
sysinfo = { version = "0.39", default-features = false, features = ["system", "multithread"] }
